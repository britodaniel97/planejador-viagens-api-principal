<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Planejador de Viagens</title>
  <desc id="desc">O cliente acessa a API principal, que persiste os dados no SQLite, solicita cálculos à API secundária e consulta a previsão na Open-Meteo.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-start" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9 0 L0 4.5 L9 9 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .note { font-size: 12px; fill: #475569; }
      .card { stroke-width: 1.5; rx: 14; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .call { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .reply { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
      .data { fill: none; stroke: #475569; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Planejador de Viagens — arquitetura</text>

  <rect x="242" y="82" width="635" height="412" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="266" y="112" class="note">REDE DOCKER</text>

  <rect x="30" y="220" width="172" height="112" class="card" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="259" text-anchor="middle" class="heading">Cliente</text>
  <text x="116" y="284" text-anchor="middle" class="body">Swagger / HTTP</text>
  <text x="116" y="309" text-anchor="middle" class="note">uma chamada</text>

  <rect x="300" y="190" width="285" height="190" class="card" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="442" y="229" text-anchor="middle" class="heading">API principal</text>
  <text x="442" y="256" text-anchor="middle" class="body">FastAPI · porta 8000</text>
  <line x1="334" y1="274" x2="551" y2="274" stroke="#93c5fd"/>
  <text x="442" y="301" text-anchor="middle" class="body">CRUD de viagens</text>
  <text x="442" y="327" text-anchor="middle" class="body">orquestra os serviços</text>
  <text x="442" y="353" text-anchor="middle" class="note">retorna dados consolidados</text>

  <rect x="645" y="130" width="210" height="112" class="card" fill="#dcfce7" stroke="#86efac"/>
  <text x="750" y="166" text-anchor="middle" class="heading">API secundária</text>
  <text x="750" y="191" text-anchor="middle" class="body">FastAPI · porta 8001</text>
  <text x="750" y="216" text-anchor="middle" class="note">distância e duração</text>

  <rect x="645" y="332" width="210" height="105" class="card" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="750" y="369" text-anchor="middle" class="heading">SQLite</text>
  <text x="750" y="395" text-anchor="middle" class="body">dados básicos</text>
  <text x="750" y="418" text-anchor="middle" class="note">da viagem</text>

  <rect x="950" y="220" width="220" height="112" class="card" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="1060" y="257" text-anchor="middle" class="heading">Open-Meteo</text>
  <text x="1060" y="282" text-anchor="middle" class="body">API externa pública</text>
  <text x="1060" y="307" text-anchor="middle" class="note">geocoding e previsão</text>

  <path d="M202 255 H300" class="flow"/>
  <text x="251" y="243" text-anchor="middle" class="note">REST</text>
  <path d="M300 313 H202" class="reply"/>
  <text x="251" y="337" text-anchor="middle" class="note">resposta</text>

  <path d="M585 225 H610 V172 H645" class="call"/>
  <text x="625" y="151" text-anchor="middle" class="note">REST</text>
  <path d="M645 220 H630 V258 H585" class="reply"/>

  <path d="M585 285 H915 V276 H950" class="call"/>
  <text x="767" y="271" text-anchor="middle" class="note">HTTPS</text>
  <path d="M950 310 H915 V465 H615 V370 H585" class="reply"/>

  <path d="M520 380 L700 332" class="data"/>
  <text x="585" y="405" text-anchor="end" class="note">SQL</text>

  <text x="600" y="530" text-anchor="middle" class="note">A API principal guarda os dados básicos; distância, duração e previsão são obtidas ao atender cada requisição.</text>
</svg>
