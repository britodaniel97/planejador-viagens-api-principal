<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Planejador de Viagens</title>
  <desc id="desc">O cliente chama a API principal. A API principal consulta o SQLite, a API secundária para distancia e duracao, e a Open-Meteo para coordenadas e previsao.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .rest { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .response { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Planejador de Viagens — arquitetura e comunicação</text>

  <rect x="220" y="95" width="730" height="510" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="245" y="126" class="label" fill="#1d4ed8">Rede Docker interna</text>

  <rect x="35" y="278" width="145" height="105" class="box" fill="#fff" stroke="#64748b"/>
  <text x="107" y="315" text-anchor="middle" class="label">Cliente</text>
  <text x="107" y="342" text-anchor="middle" class="body">Swagger / HTTP</text>
  <text x="107" y="364" text-anchor="middle" class="small">uma chamada por operacao</text>

  <rect x="290" y="260" width="270" height="170" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="425" y="295" text-anchor="middle" class="label">API principal</text>
  <text x="425" y="324" text-anchor="middle" class="body">FastAPI · porta 8000</text>
  <text x="425" y="350" text-anchor="middle" class="body">CRUD + orquestracao</text>
  <text x="425" y="376" text-anchor="middle" class="body">compoe a resposta</text>
  <text x="425" y="405" text-anchor="middle" class="small">distancia · duracao · previsao</text>

  <rect x="655" y="160" width="245" height="145" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="777" y="194" text-anchor="middle" class="label">API secundaria</text>
  <text x="777" y="222" text-anchor="middle" class="body">FastAPI · porta 8001</text>
  <text x="777" y="250" text-anchor="middle" class="body">POST /distancia</text>
  <text x="777" y="276" text-anchor="middle" class="body">POST /duracao-estimada</text>

  <rect x="655" y="390" width="245" height="115" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="777" y="429" text-anchor="middle" class="label">SQLite</text>
  <text x="777" y="457" text-anchor="middle" class="body">dados basicos da viagem</text>
  <text x="777" y="481" text-anchor="middle" class="small">sem dados derivados</text>

  <rect x="985" y="260" width="185" height="170" class="box" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1077" y="298" text-anchor="middle" class="label">Open-Meteo</text>
  <text x="1077" y="328" text-anchor="middle" class="body">API externa publica</text>
  <text x="1077" y="359" text-anchor="middle" class="body">Geocoding</text>
  <text x="1077" y="385" text-anchor="middle" class="body">Previsao do tempo</text>

  <path d="M180 330 H290" class="arrow"/>
  <text x="235" y="316" text-anchor="middle" class="small">REST</text>
  <path d="M560 292 H610 V220 H655" class="rest"/>
  <text x="610" y="196" text-anchor="middle" class="small">REST</text>
  <path d="M655 270 H625 V352 H560" class="response"/>
  <path d="M560 407 H610 V448 H655" class="arrow"/>
  <text x="610" y="433" text-anchor="middle" class="small">SQL</text>
  <path d="M655 480 H625 V422 H560" class="response"/>
  <path d="M560 350 H985" class="rest"/>
  <text x="772" y="339" text-anchor="middle" class="small">REST: geocoding e previsao</text>

  <path d="M290 370 H180" class="response"/>
  <text x="107" y="410" text-anchor="middle" class="small">Resposta consolidada</text>
  <text x="600" y="653" text-anchor="middle" class="small">Distancia, duracao, coordenadas e previsao sao derivados em tempo de requisicao; somente os dados basicos ficam no SQLite.</text>
</svg>
